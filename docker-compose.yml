services:
  # Database Service (SQL Server)
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: death_management_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql/data

  # Backend .NET API
  backend:
    build:
      context: ./backend/src/DeathManagement.ImageApi
      dockerfile: Dockerfile
    container_name: death_management_image_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY to the same 32+ character key used by the desktop app}
      - AiService__BaseUrl=http://ai-service:8000
      - AiService__TimeoutSeconds=45

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: death_management_ai
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=development
      - AI_DATA_DIR=/app/app/data
    volumes:
      - ai_data:/app/app/data
      - ai_models:/app/app/models/image_model

  # Frontend (React Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: death_management_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
  ai_data:
  ai_models:
